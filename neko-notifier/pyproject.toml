[project]
name = "neko-notifier"
version = "0.1.0"
description = "Windows tray approval notifier for Zoo Code"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Zoo Code" }]
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "pillow>=11.3.0,<12.0.0",
    "pywin32>=310; sys_platform == 'win32'",
    "uvicorn>=0.35.0,<1.0.0",
]

[project.scripts]
neko-notifier = "neko_notifier.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "mypy>=1.17.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "pytest-cov>=6.2.0,<7.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neko_notifier"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["neko_notifier"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["win32api", "win32con", "win32gui", "win32gui_struct"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
